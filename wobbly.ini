# WindowsFX Lite — 与 https://github.com/Echooff3/wobbly-windows 对齐的默认参数
# 改完后重启程序生效

enabled=1
snap=1
snap_dist=24
drag_threshold=4
fps=60

# script.js: SPRING_STIFFNESS / SPRING_DAMPING
spring_k=0.12
spring_damp=0.60

# script.js: WOBBLE_FACTOR 与 maxSkew=20
wobble_factor=0.08
max_skew=20

# 速度拉伸: 1 + abs(v)*stretch_vel - abs(正交速度)*squash_vel
stretch_vel=0.005
squash_vel=0.002
max_stretch=0.18

# 性能（核显/高分屏）：
# render_scale_min: 自适应分辨率下限，0.25~1.0。机器跟不上 60fps 时自动
#                   降内部分辨率渲染再拉伸，帧率优先；1.0=永不降分辨率
# render_threads:    光栅线程总数（含主线程），0=自动（按核心数-1，最多7个）
render_scale_min=0.5
render_threads=0

debug=0
